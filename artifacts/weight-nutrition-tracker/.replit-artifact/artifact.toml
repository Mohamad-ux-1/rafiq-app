kind = "web"
previewPath = "/"
title = "رفيق الزيادة الصحية"
description = "تطبيق عربي RTL لمتابعة زيادة الوزن، السعرات، العادات اليومية، التمارين المنزلية، وتقدير الطعام مع حفظ البيانات محليًا."
version = "1.0.0"
id = "artifacts/weight-nutrition-tracker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20217

[services.development]
run = "pnpm --filter @workspace/weight-nutrition-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/weight-nutrition-tracker", "run", "build" ]
serve = "static"
publicDir = "artifacts/weight-nutrition-tracker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20217"
BASE_PATH = "/"
